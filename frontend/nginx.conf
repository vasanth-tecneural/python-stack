server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Liveness endpoint for the Docker HEALTHCHECK / k8s probes.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # /api → paired backend Service, so the backend stays ClusterIP-only.
    location /api/ {
        proxy_pass http://python-stack-backend.dd-new.svc.cluster.local:80/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long enough for a slow backend query, short enough to fail visibly.
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # SPA history fallback - unknown routes serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
