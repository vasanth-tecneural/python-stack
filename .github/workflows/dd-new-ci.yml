# Generated by DeepAgent for project "dd-new" (env "dev"). Regenerated on every deploy — edits here are overwritten; delete this line to keep the file as your own.
name: CI (build all services) · dd-new

# Manual trigger — click "Run" in the Actions tab (or the app's CI/CD Pipelines page).
# When this workflow succeeds, the CD workflow fires automatically via workflow_run.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  id-token: write   # required to request the OIDC token
  contents: read

jobs:
  build-and-push:
    name: Build and push all services
    environment: dd-new-dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC — no stored secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::411232894985:role/gha-vasanth-tecneural-python-stack-python-stack-backend
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and tag backend image
        env:
          ECR: 411232894985.dkr.ecr.us-east-1.amazonaws.com/python-stack-backend
          TAG: ${{ github.sha }}
        run: |
          docker build --build-arg VITE_API_URL="${{ vars.VITE_API_URL }}" -t "$ECR:$TAG" -t "$ECR:latest" -f "backend/Dockerfile" "."

      - name: Scan backend image for vulnerabilities (Trivy)
        continue-on-error: true
        env:
          ECR: 411232894985.dkr.ecr.us-east-1.amazonaws.com/python-stack-backend
          TAG: ${{ github.sha }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.65.0 image \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 \
            "$ECR:$TAG" || echo "::warning::Trivy flagged issues or could not run — non-blocking, see logs."
      - name: Push backend image
        env:
          ECR: 411232894985.dkr.ecr.us-east-1.amazonaws.com/python-stack-backend
          TAG: ${{ github.sha }}
        run: |
          docker push "$ECR:$TAG"
          docker push "$ECR:latest"

      - name: Build and tag frontend image
        env:
          ECR: 411232894985.dkr.ecr.us-east-1.amazonaws.com/python-stack-frontend
          TAG: ${{ github.sha }}
        run: |
          docker build --build-arg VITE_API_URL="${{ vars.VITE_API_URL }}" -t "$ECR:$TAG" -t "$ECR:latest" -f "frontend/Dockerfile" "frontend"

      - name: Scan frontend image for vulnerabilities (Trivy)
        continue-on-error: true
        env:
          ECR: 411232894985.dkr.ecr.us-east-1.amazonaws.com/python-stack-frontend
          TAG: ${{ github.sha }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.65.0 image \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 \
            "$ECR:$TAG" || echo "::warning::Trivy flagged issues or could not run — non-blocking, see logs."
      - name: Push frontend image
        env:
          ECR: 411232894985.dkr.ecr.us-east-1.amazonaws.com/python-stack-frontend
          TAG: ${{ github.sha }}
        run: |
          docker push "$ECR:$TAG"
          docker push "$ECR:latest"
